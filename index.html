<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a1124">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>반전법정: 푸른 고래 사건 파일</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0d14;font-family:'Noto Sans KR',sans-serif;color:#fff;overflow:hidden}
#game{position:relative;max-width:480px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;background:#111;overflow:hidden;user-select:none}
#top{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:#05060a;z-index:5}
#hp{display:flex;gap:4px}
#hp i{width:22px;height:12px;border-radius:3px;background:#2ecc71;box-shadow:0 0 6px #2ecc71aa;transition:.3s}
#hp i.off{background:#333;box-shadow:none}
#hp.hit{animation:flash .5s}
@keyframes flash{0%,100%{filter:none}50%{filter:drop-shadow(0 0 8px red) brightness(2)}}
.btn{border:none;border-radius:10px;font-family:inherit;font-weight:900;cursor:pointer;color:#fff}
#recBtn{background:#8a5a1c;padding:7px 12px;font-size:13px;border:2px solid #e0a64a}
#langBtn{background:transparent;color:#cfd8ef;border:2px solid #3d4f80;padding:8px 18px;font-size:14px;margin-top:14px}
#hintBtn{background:#6b5a1c;padding:7px 10px;font-size:13px;border:2px solid #e8c25a}
#contB{background:#1f4fbf;border-color:#7aa2ff;margin-bottom:10px}
#bgmBtn,#sfxBtn{background:#1c2540;padding:7px 10px;font-size:13px;border:2px solid #3d4f80;white-space:nowrap}
#stage{position:relative;flex:1;overflow:hidden;transition:background .3s}
.bg-dark{background:radial-gradient(circle at 50% 30%,#1c2340,#05060c)}
.bg-def{background:linear-gradient(180deg,#3a5a8c,#1d3052 60%,#14203a)}
.bg-pros{background:linear-gradient(180deg,#8c3a4a,#521d2a 60%,#3a141d)}
.bg-judge{background:linear-gradient(180deg,#6b5a3a,#3f3220 60%,#2a2114)}
.bg-witness{background:linear-gradient(180deg,#3a7a6a,#1d4a40 60%,#143a30)}
.bg-stripe{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(255,255,255,.05) 38px 42px)}
#portrait{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:94%;transition:opacity .2s}
#portrait img{height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:enter .25s ease-out}
@keyframes enter{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}
#portrait.f-shock img{animation:jolt .35s}
#portrait.f-smile img{animation:hop .4s}
#portrait.f-angry img{animation:lean .3s;filter:drop-shadow(0 0 14px rgba(255,40,40,.7))}
@keyframes jolt{0%{transform:scale(1)}30%{transform:scale(1.06) translateY(-8px)}100%{transform:none}}
@keyframes hop{40%{transform:translateY(-10px)}}
@keyframes lean{50%{transform:scale(1.05)}}
.face{position:absolute;top:2%;right:-8%;font-size:38px;animation:pop .3s}
.face-sweat{animation:drip 1s infinite alternate}
@keyframes drip{to{transform:translateY(8px)}}
#desk{position:absolute;left:-5%;right:-5%;bottom:0;height:22%;background:linear-gradient(180deg,#8b5a2b,#5c3a1a);border-top:6px solid #c08040;box-shadow:0 -4px 12px #0008}
#evPop{position:absolute;top:12px;right:12px;width:110px;background:#f5e6c8;color:#3a2a10;border:3px solid #b8862e;border-radius:10px;padding:8px;text-align:center;font-size:12px;font-weight:700;display:none;animation:pop .3s}
#evPop b{display:block;font-size:34px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#ceLabel{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#0a0;color:#fff;padding:4px 14px;border-radius:20px;font-weight:900;font-size:13px;display:none;box-shadow:0 0 12px #0f0a;white-space:nowrap}
#box{position:relative;height:30%;min-height:170px;background:rgba(8,10,30,.96);border-top:4px solid #e8c25a;padding:26px 16px 14px;cursor:pointer;z-index:6}
#name{position:absolute;top:-18px;left:12px;background:#2d55a5;border:2px solid #e8c25a;padding:3px 14px;border-radius:8px;font-weight:900;font-size:15px}
#name:empty{display:none}
#text{font-size:17px;line-height:1.6;white-space:pre-wrap;word-break:keep-all}
#text.think{color:#7fd4ff}
#text.stmt{color:#5dff8a;font-weight:700}
#text.nar{color:#ddd;font-style:italic}
#arrow{position:absolute;right:16px;bottom:10px;color:#e8c25a;animation:bob .7s infinite alternate;visibility:hidden}
@keyframes bob{to{transform:translateY(5px)}}
#ce{display:none;gap:6px;padding:8px;background:#05060a;z-index:5}
#ce .btn{flex:1;padding:13px 0;font-size:15px}
.nav{background:#444;flex:.6!important}
.press{background:#2d55a5;border:2px solid #7aa2ff}
.present{background:#c8102e;border:2px solid #ff7a8a}
#fx{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.15),rgba(0,0,0,.6))}
#fx span{font-family:'Black Han Sans',sans-serif;font-size:64px;color:#fff;-webkit-text-stroke:3px #c8102e;text-shadow:5px 5px 0 #c8102e,0 0 30px #ff0;transform:rotate(-8deg);animation:boom .35s cubic-bezier(.2,2,.4,1)}
#fx.blue span{-webkit-text-stroke-color:#1f4fbf;text-shadow:5px 5px 0 #1f4fbf,0 0 30px #0ff}
#fx.gold span{-webkit-text-stroke-color:#b8862e;text-shadow:5px 5px 0 #b8862e,0 0 40px #ff0;font-size:80px}
@keyframes boom{from{transform:rotate(-8deg) scale(3);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(5px,-2px)}}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.88);z-index:30;display:none;flex-direction:column;padding:14px}
.modal h2{font-family:'Black Han Sans';font-size:24px;color:#e8c25a;margin-bottom:4px}
#recHint{color:#7fd4ff;font-size:13px;margin-bottom:10px;min-height:18px}
#recList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.ev{background:#f5e6c8;color:#3a2a10;border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;border:3px solid #b8862e}
.ev .ic{font-size:36px}
.ev h3{font-size:16px}
.ev p{font-size:13px;line-height:1.5;margin-top:3px}
.ev .btn{background:#c8102e;margin-top:8px;padding:7px 14px;font-size:13px}
#recClose{background:#444;padding:12px;margin-top:10px;font-size:15px}
#toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#e8c25a;color:#3a2a10;padding:8px 16px;border-radius:20px;font-weight:900;font-size:13px;z-index:35;display:none;width:max-content;max-width:90%;text-align:center;word-break:keep-all}
#title,#over{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#24346a,#06070d)}
#title{overflow-y:auto}
#title h1{font-family:'Black Han Sans';font-size:52px;line-height:1.05;color:#fff;-webkit-text-stroke:2px #c8102e;text-shadow:4px 4px 0 #c8102e}
#title h2{margin:14px 0 6px;font-size:18px;color:#e8c25a}
#title p,#over p{color:#aab;font-size:14px;line-height:1.7;margin:10px 0 26px}
.big{background:#c8102e;border:3px solid #ff7a8a;padding:14px 22px;font-size:17px;width:100%;max-width:320px}
#over{display:none}
#epList{display:flex;flex-direction:column;gap:9px;width:100%;align-items:center}
.ep{font-size:15px;padding:12px 14px}
.ep:nth-child(2){background:#1f4fbf;border-color:#7aa2ff}.ep:nth-child(3){background:#7a3fb0;border-color:#c79bff}.ep:nth-child(4){background:#0f7a5a;border-color:#6fe0b8}.ep:nth-child(5){background:#b8862e;border-color:#ffe08a}
#credits{position:absolute;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;background:#05060c;padding:16px}
#credWrap{flex:1;width:100%;overflow:hidden;position:relative;mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
#credRoll{position:absolute;left:0;right:0;top:100%;text-align:center;animation:roll 38s linear forwards}
@keyframes roll{to{transform:translateY(calc(-100% - 70vh))}}
#credRoll h1{font-family:'Black Han Sans';font-size:46px;-webkit-text-stroke:2px #c8102e;text-shadow:3px 3px 0 #c8102e}
#credRoll h3{color:#e8c25a;margin:6px 0 30px}
#credRoll h2{font-family:'Black Han Sans';font-size:40px;color:#e8c25a;margin-top:40px}
#credRoll p{color:#aab;margin-top:8px}
.cr{display:flex;align-items:center;gap:16px;justify-content:center;margin:14px 0}
.cr img{height:150px}
.cr div{text-align:left;width:150px}.cr b{display:block;font-size:20px}.cr span{color:#9ab;font-size:13px}
#over h1{font-family:'Black Han Sans';font-size:44px;color:#ff5a6a}
#over.win h1{color:#5dff8a}
</style>
</head>
<body>
<div id="game">
  <div id="top">
    <div id="hp"></div>
    <div style="display:flex;gap:6px"><button class="btn" id="hintBtn" style="display:none">💡</button><button class="btn" id="bgmBtn">🎵 음악</button><button class="btn" id="sfxBtn" title="효과음 켜기/끄기">🔔</button><button class="btn" id="recBtn" data-t="record">📁 법정기록</button></div>
  </div>
  <div id="stage" class="bg-dark">
    <div class="bg-stripe"></div>
    <div id="portrait"></div>
    <div id="desk"></div>
    <div id="ceLabel" data-t="ceLabel">~ 증인 증언 ~</div>
    <div id="evPop"></div>
  </div>
  <div id="ce">
    <button class="btn nav" id="prevB">◀</button>
    <button class="btn press" id="pressB" data-t="press">추궁</button>
    <button class="btn present" id="presentB" data-t="present">증거 제시</button>
    <button class="btn nav" id="nextB">▶</button>
  </div>
  <div id="box">
    <div id="name"></div>
    <div id="text"></div>
    <div id="arrow">▼</div>
  </div>

  <div id="fx"><span></span></div>
  <div id="toast"></div>

  <div class="modal" id="rec">
    <h2 data-t="record">📁 법정기록</h2>
    <div id="recHint"></div>
    <div id="recList"></div>
    <button class="btn" id="recClose" data-t="close">닫기</button>
  </div>

  <div id="title">
    <h1 data-h="titleMain">반전<br>법정</h1>
    <h2 data-t="titleSub">푸른 고래 사건 파일</h2>
    <p data-h="titleHelp">전 6화 완결 · 증언 속 거짓을 찾아내 의뢰인을 구하라!<br>
    🔵 <b>추궁</b>: 증언을 더 캐묻기<br>
    🔴 <b>증거 제시</b>: 모순되는 증거 들이밀기<br>
    틀린 증거를 내면 신뢰도가 깎여요.</p>
    <div id="epList"></div>
    <button class="btn" id="langBtn" data-t="langBtn">🌐 English</button>
  </div>

  <div id="credits">
    <div id="credWrap"><div id="credRoll"></div></div>
    <button class="btn big" id="credBtn" data-t="toHome">처음 화면으로</button>
  </div>
  <div id="over">
    <h1 id="overT">유죄 판결…</h1>
    <p id="overP">재판장의 신뢰를 모두 잃었다.</p>
    <button class="btn big" id="contB" style="display:none"></button>
    <button class="btn big" id="overB">다시 도전</button>
  </div>
</div>

  function tone(type,f,t,dur,vol){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.setValueAtTime(vol,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function drum(kind,t){
    if(kind==='k'){ const o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12);
      g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.16); return; }
    const s=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(); s.buffer=noise;
    f.type=kind==='h'?'highpass':'bandpass'; f.frequency.value=kind==='h'?7000:1800;
    const len=kind==='h'?0.04:0.12; g.gain.setValueAtTime(kind==='h'?0.25:0.45,t); g.gain.exponentialRampToValueAtTime(0.001,t+len);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+len+0.01);
  }
  function tick(){
    if(!cur) return;
    const sec=60/cur.tr.bpm/2;
    while(nextT<ctx.currentTime+0.15){
      if(step>=cur.c.steps){ if(cur.tr.loop===false){ stop(); return; } step=0; }
      cur.c.notes.forEach(n=>{ if(n.at!==step) return;
        if(n.inst==='lead') tone('square',hz(n.m),nextT,n.len*sec*0.95,0.22);
        else if(n.inst==='bass') tone('triangle',hz(n.m),nextT,n.len*sec*0.9,0.5);
        else drum(n.inst,nextT); });
      step++; nextT+=sec;
    }
  }
  function stop(){ clearInterval(timer); timer=null; cur=null; }
  function start(name){
    stop(); if(!name||!TRACKS[name]||!ensure()) return;
    if(ctx.state==='suspended') ctx.resume();
    if(!TRACKS[name]._c) TRACKS[name]._c=compile(TRACKS[name]);
    cur={name,tr:TRACKS[name],c:TRACKS[name]._c}; step=0; nextT=ctx.currentTime+0.05;
    timer=setInterval(tick,25); tick();
  }
  /* 곡 바꾸기. 같은 곡이면 그대로 둠 */
  function play(name){
    if(cur && cur.name===name) return;
    want=name; if(ctx||unlocked) start(name);
  }
  let unlocked=false;
  /* 브라우저는 사용자가 한 번 누르기 전엔 소리를 막아요 → 첫 터치 때 시작 */
  function unlock(){ if(unlocked) return; unlocked=true; if(!cur&&want) start(want); }
  try{ document.addEventListener('pointerdown',unlock,true); document.addEventListener('keydown',unlock,true); }catch(e){}
  function setMuted(m){ muted=m; try{ localStorage.setItem('bgmMute',m?'1':'0'); }catch(e){} if(master) master.gain.value=m?0:0.09; drawBtn(); }
  function drawBtn(){ const b=document.getElementById('bgmBtn'); if(b) b.textContent=muted?T('musicOff'):T('music'); }
  const b=document.getElementById('bgmBtn'); if(b){ b.onclick=()=>setMuted(!muted); drawBtn(); }
  return {play,pause:()=>{ if(ctx&&ctx.state==='running') ctx.suspend(); },resume:()=>{ if(ctx&&ctx.state==='suspended') ctx.resume(); },stop:()=>{want=null;stop();},setMuted,get now(){return want;}};
})();

</script>
<script>
/* ---------- 효과음 ----------
   음악 파일 없이 브라우저가 직접 만드는 소리예요. 사용법: snd('이름') 또는 snd('blip',{who:'me'})
   소리 목록
   - blip      대사 글자 소리 (말하는 캐릭터마다 목소리 높이가 달라요)
   - objection 「이의 있음!」   hold 「잠깐!」   take 「받아라!」   gavel 「무죄」 판사봉 3번
   - boom      그 밖의 큰 글씨 연출
   - hit       화면 흔들림(보통)   slam 화난 표정 + 흔들림(책상 쾅)   shock 놀란 표정 + 흔들림
   - evidence  증거 추가   ping 증거 그림이 뜰 때   present 증거 제시   wrong 틀렸을 때(신뢰도 감소)
   - open/close 법정기록 열기/닫기   page 심문 증언 넘기기   select 버튼   start 회차 시작   ding 알림
*/
let SFX_CTX=null, SFX_NOISE=null, SFX_MUTED=false;
try{ SFX_MUTED=localStorage.getItem('sfxMute')==='1'; }catch(e){}

/* 캐릭터별 목소리 높이(Hz)와 음색 */
const VOICE={
  me:[520,'square'], asst:[760,'square'], pros:[600,'square'], judge:[300,'square'],
  guard:[380,'square'], def:[680,'triangle'], det:[340,'square'], lea:[640,'triangle'],
  noeul:[720,'triangle'], dir:[320,'triangle'], chief:[260,'sawtooth'], nar:[440,'triangle']
};

function sfxCtx(){
  if(!SFX_CTX){
    const AC=window.AudioContext||window.webkitAudioContext;
    SFX_CTX=new AC();
    SFX_NOISE=SFX_CTX.createBuffer(1,SFX_CTX.sampleRate,SFX_CTX.sampleRate);
    const d=SFX_NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  if(SFX_CTX.state==='suspended') SFX_CTX.resume();
  return SFX_CTX;
}
/* 음 하나: 파형, 시작 높이 → 끝 높이, 시작 시각, 길이, 크기 */
function sfxTone(type,f1,f2,t,dur,vol){
  const c=SFX_CTX,o=c.createOscillator(),g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); if(f2&&f2!==f1) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
/* 잡음: 필터 종류, 필터 높이 시작 → 끝 */
function sfxNoise(t,dur,vol,ftype,f1,f2){
  const c=SFX_CTX,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=SFX_NOISE; f.type=ftype; f.frequency.setValueAtTime(f1,t); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t+dur+0.02);
}

const SFX={
  blip(t,o){ const [f,w]=VOICE[o.who]||[480,'square']; const r=f*(0.95+Math.random()*0.1);
    sfxTone(o.think?'sine':w,r,r,t,0.045,o.think?0.04:0.03); },
  objection(t){ sfxNoise(t,0.15,0.5,'bandpass',2500,600);
    [220,277,330,440].forEach(f=>sfxTone('sawtooth',f*1.5,f,t,0.45,0.09)); sfxTone('sine',110,50,t,0.5,0.4); },
  hold(t){ sfxTone('square',660,660,t,0.08,0.12); sfxTone('square',990,990,t+0.09,0.18,0.12); sfxNoise(t,0.08,0.2,'highpass',3000); },
  take(t){ sfxNoise(t,0.25,0.35,'bandpass',400,5000);
    sfxTone('square',523,523,t+0.22,0.3,0.1); sfxTone('square',784,784,t+0.22,0.3,0.1); sfxTone('sine',130,60,t+0.22,0.35,0.35); },
  gavel(t){ [0,0.22,0.44].forEach(d=>{ sfxTone('triangle',190,90,t+d,0.12,0.5); sfxNoise(t+d,0.06,0.4,'lowpass',1500); }); },
  boom(t){ sfxTone('sawtooth',220,60,t,0.6,0.25); },
  hit(t){ sfxTone('triangle',300,80,t,0.35,0.2); },
  slam(t){ sfxNoise(t,0.18,0.7,'lowpass',600,120); sfxTone('sine',90,40,t,0.25,0.5); },
  shock(t){ sfxTone('sawtooth',1200,180,t,0.5,0.12); sfxTone('square',600,90,t,0.5,0.08); sfxNoise(t,0.3,0.25,'highpass',2000,600); },
  evidence(t){ [784,988,1175,1568].forEach((f,i)=>sfxTone('sine',f,f,t+i*0.06,0.25,0.12)); },
  ping(t){ sfxTone('sine',1320,1320,t,0.15,0.08); sfxTone('sine',1980,1980,t+0.04,0.12,0.04); },
  present(t){ sfxNoise(t,0.18,0.3,'bandpass',800,4000); sfxTone('triangle',440,880,t,0.15,0.12); },
  wrong(t){ sfxTone('square',220,200,t,0.18,0.12); sfxTone('square',165,140,t+0.2,0.3,0.12); },
  open(t){ sfxTone('triangle',420,640,t,0.09,0.15); sfxNoise(t,0.07,0.08,'highpass',4000); },
  close(t){ sfxTone('triangle',640,420,t,0.09,0.15); },
  page(t){ sfxTone('triangle',900,700,t,0.04,0.12); },
  select(t){ sfxTone('square',1000,1000,t,0.03,0.06); },
  start(t){ [523,659,784,1047].forEach((f,i)=>sfxTone('square',f,f,t+i*0.08,0.18,0.07)); },
  ding(t){ sfxTone('sine',880,880,t,0.1,0.12); sfxTone('sine',1320,1320,t+0.1,0.3,0.12); }
};
function snd(type,opt){
  if(SFX_MUTED||!SFX[type]) return;
  try{ const c=sfxCtx(); SFX[type](c.currentTime,opt||{}); }catch(e){}
}
function setSfxMuted(m){
  SFX_MUTED=m; try{ localStorage.setItem('sfxMute',m?'1':'0'); }catch(e){}
  const b=document.getElementById('sfxBtn'); if(b) b.textContent=m?'🔕':'🔔';
  if(!m) snd('select');
}
(()=>{ const b=document.getElementById('sfxBtn'); if(b){ b.onclick=()=>setSfxMuted(!SFX_MUTED); b.textContent=SFX_MUTED?'🔕':'🔔'; } })();

</script>
<script>
/* ---------- 보상형 광고 (AdMob) ----------
   - 안드로이드 앱(Capacitor)에서만 진짜 광고가 나와요.
   - 웹사이트에서는 광고 없이 바로 보상을 줘요.
   - 사용법: Ads.reward(()=>{ 보상 주기 })
   - 광고 ID는 아래 AD_IDS 에 있어요. 지금은 구글 「테스트 광고」 ID예요.
     AdMob 에서 내 광고 ID를 받으면 바꾸고, TESTING 을 false 로 바꾸세요. */
const AD_IDS = {
  reward: 'ca-app-pub-3940256099942544/5224354917'   // ← 구글 테스트용 보상형 광고 ID
};
const AD_TESTING = true;   // ← 진짜 광고로 바꿀 때 false

const Ads = (() => {
  const cap = typeof window !== 'undefined' ? window.Capacitor : null;
  const native = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
  const AdMob = native && cap.Plugins && cap.Plugins.AdMob;
  let ready = false, loading = null, busy = false;

  function load() {
    if (!AdMob || loading) return loading;
    loading = AdMob.prepareRewardVideoAd({ adId: AD_IDS.reward, isTesting: AD_TESTING })
      .then(() => { ready = true; })
      .catch(() => { ready = false; })
      .finally(() => { loading = null; });
    return loading;
  }

  async function init() {
    if (!AdMob) return;
    try {
      await AdMob.initialize({ initializeForTesting: AD_TESTING });
      /* 유럽 등에서 필요한 「광고 동의」 창 (필요한 나라에서만 떠요) */
      try {
        const info = await AdMob.requestConsentInfo();
        if (info && info.isConsentFormAvailable && info.status === 'REQUIRED') await AdMob.showConsentForm();
      } catch (e) {}
      load();
    } catch (e) {}
  }

  /* 광고를 끝까지 보면 ok() 실행 */
  async function reward(ok) {
    if (!AdMob) { ok(); return; }          // 웹사이트: 광고 없이 바로 보상
    if (busy) return; busy = true;
    try {
      if (!ready) { toast('📺 …', 'select'); await load(); }
      if (!ready) { toast(T('adFail'), 'wrong'); return; }
      /* 광고가 닫히거나 실패하면 끝. 끝까지 봤을 때만 「보상」 신호가 와요 */
      let got = false;
      const hs = [];
      let res;
      const done = new Promise(r => { res = r;
        AdMob.addListener('onRewardedVideoAdReward', () => { got = true; }).then(h => hs.push(h));
        AdMob.addListener('onRewardedVideoAdDismissed', res).then(h => hs.push(h));
        AdMob.addListener('onRewardedVideoAdFailedToShow', res).then(h => hs.push(h));
      });
      BGM.pause(); ready = false;
      AdMob.showRewardVideoAd().then(() => { got = true; }).catch(() => res());
      await done;
      hs.forEach(h => h.remove());
      BGM.resume();
      setTimeout(() => { if (got) ok(); else toast(T('adSkip'), 'wrong'); }, 300);
    } finally {
      busy = false; load();                // 다음 광고 미리 준비
    }
  }

  init();
  return { reward, get native() { return native; } };
})();

</script>
<script>
/* ---------- 엔진 ---------- */
const $=id=>document.getElementById(id);
const S={hp:5,ev:[],mode:'talk',list:[],i:0,after:null,typing:false,full:''};
/* 효과음 snd() 는 js/sfx.js 에 있어요 */
function drawHP(){ $('hp').innerHTML=Array.from({length:5},(_,k)=>`<i class="${k<S.hp?'':'off'}"></i>`).join(''); }
function setBg(b){ $('stage').className='bg-'+b; $('desk').style.display=b==='dark'?'none':'block'; }
function shake(){ const g=$('game'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); }
function toast(m,sound){ const t=$('toast'); t.textContent=m; t.style.display='block'; snd(sound||'ding'); clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',1800); }

function typeText(t,cls){
  clearInterval(S.tm); const el=$('text'); el.className=cls||''; el.textContent=''; S.full=t; S.typing=true;
  $('arrow').style.visibility='hidden'; let k=0;
  S.tm=setInterval(()=>{ el.textContent=t.slice(0,++k); if(k%2&&t[k-1]!==' ')snd('blip',{who:S.cur&&S.cur.s,think:cls==='think'}); if(k>=t.length)finish(); },30);
}
function finish(){ clearInterval(S.tm); $('text').textContent=S.full; S.typing=false; $('arrow').style.visibility='visible'; }

function show(st){
  S.cur=st;
  const c=CH[st.s]||{};
  setBg(st.bg||c.bg||($('stage').className.replace('bg-','')));
  if(c.style){ const p=$('portrait'); p.innerHTML=portrait(st.s,st.f); p.className='f-'+(st.f||'normal'); p.style.opacity=1; }
  else $('portrait').style.opacity=0;
  $('name').textContent=c.name||'';
  $('name').style.background={me:'#3a4a5a',pros:'#8b1e2d',judge:'#6b5a3a',asst:'#c47a12',def:'#5a6a3a'}[st.s]||'#2a4a6a';
  if(st.ev&&st.ev!==S.lastEv) snd('ping'); S.lastEv=st.ev||null;
  if(st.ev){ const e=EV[st.ev]; $('evPop').innerHTML=`<b>${e.ic}</b>${e.n}`; $('evPop').style.display='block'; } else $('evPop').style.display='none';
  if(st.shake){ shake(); snd(st.f==='shock'?'shock':st.f==='angry'?'slam':'hit'); }
  typeText(st.t, st.cls||(st.think?'think':st.s==='nar'?'nar':''));
}
function fx(text,cls,cb){
  if(cls==='gold') BGM.play('win');
  const f=$('fx'); f.className=cls||''; f.querySelector('span').textContent=text;
  f.style.display='flex'; const sp=f.querySelector('span'); sp.style.animation='none'; void sp.offsetWidth; sp.style.animation='';
  snd({'이의 있음!':'objection','잠깐!':'hold','받아라!':'take','무죄':'gavel','Objection!':'objection','Wait!':'hold',"Here's proof!":'take','NOT GUILTY':'gavel'}[text]||'boom'); shake(); setTimeout(()=>{f.style.display='none';cb()},1200);
}
function run(list,after){ S.list=list; S.i=0; S.after=after||null; S.mode='talk'; hintVis(); $('ce').style.display='none'; $('ceLabel').style.display='none'; next(); }
function play(name){ run(SC[name]); }
function next(){
  const st=S.list[S.i++];
  if(!st){ if(S.after){const f=S.after;S.after=null;f();} return; }
  if(st.ce){ S.check=()=>startCE(st.ce); return startCE(st.ce); }
  if(st.choose){ S.check=()=>startChoose(st); return startChoose(st); }
  if(st.addEv){ st.addEv.forEach(id=>{if(!S.ev.includes(id))S.ev.push(id)}); toast(T('evAdded',st.addEv.length),'evidence'); return next(); }
  if(st.fx){ S.mode='busy'; return fx(st.fx,st.cls,()=>{S.mode='talk';next()}); }
  if(st.end) return ending(true);
  if(st.credits) return rollCredits();
  if(st.goto) return play(st.goto);
  show(st);
}

/* 심문 */
function startCE(id){ BGM.play('ce'); S.ce=CE[id]; S.ci=0; S.mode='ce'; stmt(); }
function stmt(){
  S.mode='ce'; hintVis(); const ce=S.ce, s=ce.st[S.ci];
  $('ce').style.display='flex'; $('ceLabel').style.display='block';
  $('ceLabel').textContent=`${ce.title}  ${S.ci+1}/${ce.st.length}`;
  show({s:ce.w,f:'normal',t:s.t,cls:'stmt'});
}
function ceMove(d){ snd('page'); const n=S.ce.st.length; S.ci=(S.ci+d+n)%n; stmt(); }
function press(){
  if(S.typing)finish();
  const s=S.ce.st[S.ci];
  run([{fx:T('fxWait'),cls:'blue'},...s.p],()=>stmt());
}
function damage(){ S.hp--; drawHP(); const h=$('hp'); h.classList.remove('hit'); void h.offsetWidth; h.classList.add('hit'); snd('wrong'); shake(); }
function presented(id){
  closeRec(); snd('present');
  if(S.mode==='ce'){
    const ce=S.ce;
    if(id===ce.ans.ev && ce.ans.st.includes(S.ci)){ BGM.play('pursuit'); return play(ce.ok); }
    run([{fx:T('fxObjection')},{s:'me',f:'angry',t:T('wrongCE'),ev:id},...WRONG],()=>{damage(); S.hp<=0?ending(false):stmt();});
  } else if(S.mode==='choose'){
    const c=S.choose;
    if(id===c.choose){ BGM.play('pursuit'); return play(c.ok); }
    run([{s:'me',f:'angry',t:T('wrongChoose'),ev:id},...WRONG_CHOOSE],()=>{damage(); S.hp<=0?ending(false):startChoose(c);});
  }
}
function startChoose(st){
  BGM.play('pursuit'); S.mode='choose'; S.choose=st; hintVis(); $('ce').style.display='none'; $('ceLabel').style.display='none';
  show({s:'nar',t:'▶ '+st.prompt+'\n'+T('openHint'),cls:'think'});
  setTimeout(()=>openRec(true),600);
}

/* 힌트 (앱에서는 보상형 광고를 보고 받아요 — js/ads.js) */
function hintVis(){ $('hintBtn').style.display=(S.mode==='ce'||S.mode==='choose')?'':'none'; }
function hintText(){
  if(S.mode==='ce') return T('hintCE',S.ce.ans.st[0]+1,EV[S.ce.ans.ev].n);
  if(S.mode==='choose') return T('hintChoose',EV[S.choose.choose].n);
}
function hintKey(){ return S.mode==='ce'?'ce:'+S.ce.title:S.mode==='choose'?'ch:'+S.choose.choose:''; }
function showHint(){ const t=$('toast'); toast(hintText(),'ding'); clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',4500); S.hinted=hintKey(); }
$('hintBtn').onclick=()=>{
  if(S.mode!=='ce'&&S.mode!=='choose') return;
  if(S.typing) finish();
  if(S.hinted===hintKey()) return showHint();          // 이미 본 힌트는 다시 무료
  if(Ads.native) toast(T('hintAd'),'select');
  const k=hintKey(); Ads.reward(()=>{ if(hintKey()===k) showHint(); });
};

/* 법정기록 */
function openRec(present){
  snd('open');
  S.presenting=present;
  $('recHint').textContent=present?(S.hinted===hintKey()?hintText():S.mode==='choose'?S.choose.prompt:T('pickHint')):'';
  $('recList').innerHTML=S.ev.map(id=>{const e=EV[id];return `<div class="ev"><div class="ic">${e.ic}</div><div><h3>${e.n}</h3><p>${e.d}</p>${present?`<button class="btn" data-id="${id}">${T('presentThis')}</button>`:''}</div></div>`}).join('')||'<p>'+T('noEv')+'</p>';
  $('rec').style.display='flex';
}
function closeRec(){ $('rec').style.display='none'; }

function rollCredits(){
  S.mode='busy'; BGM.play('ending');
  const C=T('cast'), cast=Object.keys(C).map(k=>[k,C[k][0],C[k][1]]);
  $('credRoll').innerHTML=`<h1>${T('credTitle')}</h1><h3>${T('credSub')}</h3>`+cast.map(c=>`<div class="cr"><img src="${IMG[c[0]+'_smile']||IMG[c[0]]}"><div><b>${c[1]}</b><span>${c[2]}</span></div></div>`).join('')+`<h2>THE END</h2><p>${T('credThanks')}</p>`;
  const c=$('credits'); c.style.display='flex'; const r=$('credRoll'); r.style.animation='none'; void r.offsetWidth; r.style.animation='';
  snd('ding');
}
function ending(win){
  if(!win) BGM.play('lose');
  const o=$('over'); o.className=win?'win':''; o.style.display='flex';
  $('overT').textContent=win?T('winT'):T('guiltyT');
  $('overP').innerHTML=win?T('winP','🟩'.repeat(S.hp)+'⬛'.repeat(5-S.hp)):T('guiltyP');
  $('overB').textContent=win?(S.ep<EPS.length?T('nextEp',S.ep+1):T('toHome')):T('retryEp');
  $('contB').style.display=win?'none':''; $('contB').textContent=Ads.native?T('contBtn'):T('contFree');
  S.won=win;
}

/* 입력 */
$('box').onclick=()=>{
  if(S.typing){finish();return;}
  if(S.mode==='talk')next();
  else if(S.mode==='ce')ceMove(1);
  else if(S.mode==='choose')openRec(true);
};
$('prevB').onclick=()=>ceMove(-1);
$('nextB').onclick=()=>ceMove(1);
$('pressB').onclick=press;
$('presentB').onclick=()=>{ if(S.typing)finish(); openRec(true); };
$('recBtn').onclick=()=>{ if(S.mode==='busy')return; openRec(S.mode==='ce'||S.mode==='choose'); };
$('recClose').onclick=()=>{ snd('close'); closeRec(); };
$('recList').onclick=e=>{ const b=e.target.closest('button[data-id]'); if(b&&S.presenting)presented(b.dataset.id); };
const BASE={};
function applyRoles(n){
  Object.keys(CH).forEach(k=>{ if(!BASE[k]) BASE[k]={name:CH[k].name,bg:CH[k].bg}; CH[k].name=BASE[k].name; CH[k].bg=BASE[k].bg; });
  const r=EPS[n-1].roles; Object.keys(r).forEach(k=>{ const [nm,bg]=r[k].split('|'); CH[k].name=nm; CH[k].bg=bg; });
}
function startEp(n){ applyRoles(n); BGM.play('court'); snd('start'); $('title').style.display='none'; $('credits').style.display='none'; S.ep=n; S.hp=5; S.ev=[]; drawHP(); play(EPS[n-1].s); }
$('epList').innerHTML=EPS.map((e,i)=>`<button class="btn big ep" data-n="${i+1}">${e.t}</button>`).join('');
$('epList').onclick=e=>{const b=e.target.closest('.ep'); if(b)startEp(+b.dataset.n);};
$('credBtn').onclick=()=>{ snd('select'); BGM.play('title'); $('credits').style.display='none'; $('title').style.display='flex'; };
$('overB').onclick=()=>{
  snd('select');
  $('over').style.display='none'; S.hp=5; drawHP();
  if(S.won){ if(S.ep<EPS.length) startEp(S.ep+1); else { BGM.play('title'); $('title').style.display='flex'; } } else startEp(S.ep);
};
/* 유죄일 때: 광고를 보면 마지막 증언부터 이어하기 */
$('contB').onclick=()=>{ snd('select'); Ads.reward(()=>{ $('over').style.display='none'; S.hp=5; drawHP(); S.check(); }); };
drawHP();
BGM.play('title');

</script>
<script>/* 앱으로 설치됐을 때 인터넷 없이도 돌아가게 (app 폴더에서만 동작) */
if('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.Capacitor) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
